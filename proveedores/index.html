<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: herramienta móvil de una columna; barra superior fija, contenido en tarjetas, navegación inferior. Fondo negro como las demás apps del COE. */
:root{
  color-scheme:dark;
  --bg:#0a0d0e; --panel:#121719; --panel2:#192124; --line:#263237;
  --fg:#e6eef0; --muted:#8c9ea4; --accent:#4cc3d3; --accent-ink:#04252a;
  --ok:#63cf8d; --warn:#e8b54a; --bad:#ef6c60;
  --paper:#ffffff; --ink:#111416; --ink2:#5b6468; --rule:#d5dadc;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:960px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;color:var(--accent);flex:none}
.brand b{display:block;font-weight:800;font-size:17px;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.who select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;max-width:200px}

main{padding-block:16px 120px}
.proto{font-size:12px;color:var(--warn);border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent);border-radius:8px;padding:6px 10px;margin-bottom:14px}
h2{font-size:20px;font-weight:700;margin:0 0 4px;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

input[type=search],input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{font-family:var(--f-num);font-size:12.5px;min-height:150px}
input[type=search]{font-size:16px;padding:13px 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.acc{color:var(--accent)}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.tag.cheap{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.fast{color:var(--ok);border-color:var(--ok)}
.tag.bal{color:var(--warn);border-color:var(--warn)}
.tag.eq{color:var(--muted)}

.list{display:grid;gap:6px}
.art-item{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.art-item[aria-current=true]{border-color:var(--accent)}
.art-item .n{font-weight:600}
.art-item .s{font-size:12px;color:var(--muted)}
.art-item .p{font-size:13px;text-align:right;white-space:nowrap}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.controls label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
@media (max-width:520px){.controls{grid-template-columns:1fr}}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.stepper button{border:0;background:var(--panel2);width:42px;height:42px;font-size:18px}
.stepper input{border:0;border-radius:0;text-align:center;width:100%;min-width:0;background:transparent;font-family:var(--f-num)}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg)}
.switch input{width:18px;height:18px;accent-color:var(--accent)}

.offers{display:grid;gap:10px}
.offer{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.offer.first{border-color:var(--accent)}
.offer.nostock{opacity:.7}
.offer-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rank{font-family:var(--f-num);font-size:12px;color:var(--muted);margin-right:6px}

.stars{font-size:12px;color:var(--warn);font-family:var(--f-num)}

.offer-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.spark{display:flex;align-items:center;gap:6px;font-size:12px}
.spark svg{width:84px;height:26px}
.diff-up{color:var(--bad)}.diff-down{color:var(--ok)}

.group{display:grid;gap:10px}
.line-item{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:10px 0;border-top:1px solid var(--line)}
.line-item:first-of-type{border-top:0}
.line-item .ctl{grid-column:1/-1;display:grid;grid-template-columns:120px 1fr auto;gap:8px}

.totals{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px}

.warnbox{font-size:12.5px;border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn)}
.infobox{font-size:12.5px;border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}

.order-card{display:grid;gap:6px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}

.supgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:9px 4px 10px;display:grid;justify-items:center;gap:3px;font-size:11.5px;color:var(--muted);position:relative}

nav.tabs button[aria-current=page]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-family:var(--f-num)}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}

.pinbox input{font-size:26px;letter-spacing:.5em;text-align:center;font-family:var(--f-num)}

.paper{background:var(--paper);color:var(--ink);border-radius:8px;padding:18px;font-size:12.5px;display:grid;gap:12px}
.paper .ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:10px}
.paper .lg{display:flex;gap:8px;align-items:center}
.paper .lg svg{width:38px;height:38px;color:var(--ink)}
.paper .lg b{font-size:14px;display:block}
.paper .lg small{font-size:10.5px;color:var(--ink2);display:block}
.paper h4{margin:0;font-size:15px;text-align:right}
.paper .fol{font-family:var(--f-num);font-size:13px;text-align:right}
.paper .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}

.paper .meta span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}

.paper table th{color:var(--ink2);border-bottom:1px solid var(--ink)}
.paper table td{border-bottom:1px solid var(--rule)}
.paper .pf{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap}
.paper .qr{display:grid;justify-items:center;gap:4px;font-size:10px;color:var(--ink2);text-align:center;max-width:130px}

.theme-btn{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;text-align:left;display:grid;gap:6px;font-size:13px;font-weight:600}
.theme-btn[aria-pressed=true]{border-color:var(--accent)}

.theme-btn .pv i{display:block;height:8px;border-radius:3px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw button[aria-pressed=true]{border-color:var(--fg)}
.sw input[type=color]{width:46px;height:38px;padding:2px;border-radius:10px}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);font-weight:600;font-size:13.5px;border-radius:10px;padding:10px 14px;max-width:calc(100% - 32px)}

.lrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}

#login{min-height:100%;display:grid;place-items:center;padding-block:24px}
.login-card{width:100%;max-width:380px;display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.login-card .brand{margin-bottom:8px}
.who-chip{font-size:12px;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

var money=new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"});
function $m(n){return money.format(n||0)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function iso(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function today(){return iso(new Date())}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function fdate(s){if(!s)return "";var d=new Date(s.length>10?s:s+"T12:00:00");return d.toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"})}
function fdt(s){var d=new Date(s);return d.toLocaleDateString("es-MX",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}
function sup(id){return D.sup.find(function(s){return s.id===id})||{id:id,nombre:"Proveedor",envio:null}}
function art(id){return D.art.find(function(a){return a.id===id})}
function lista(id){return D.listas.find(function(l){return l.id===id})}
function offersFor(a){return D.off.filter(function(o){return o.art===a})}
function offer(s,a){var c=D.off.filter(function(o){return o.sup===s&&o.art===a});if(c.length<2)return c[0];return c.sort(function(p,q){return p.precio/p.units-q.precio/q.units})[0]}
function cap(v,txt){return v==null||v===""?'<span class="warn">Por capturar</span>':txt}
function pl(u,n){if(n===1)return u;return /[lnr]$/.test(u)?u+'es':u+'s'}
function envioTxt(s){var e=s.envio;if(!e)return "Envío por capturar";return e.t==="incl"?"Envío incluido":e.t==="fijo"?"Envío "+$m(e.c):"Envío "+$m(e.c)+", gratis desde "+$m(e.d)}
function envioDe(s,sub){var e=s.envio;if(!e||e.t==="incl")return 0;if(e.t==="fijo")return +e.c||0;return sub>=e.d?0:(+e.c||0)}
function packTxt(o,a){return o.units===1?"1 "+a.u:esc(o.pres)}
function vigL(l){
  if(!l)return {c:"warn",t:"Sin lista"};
  if(!l.v){var age=Math.round((new Date(today()+"T12:00:00")-new Date(l.f+"T12:00:00"))/864e5);return age>180?{c:"warn",t:"Lista de hace "+Math.round(age/30)+" meses, sin vigencia"}:{c:"ok",t:"Lista del "+fdate(l.f)+" (sin vigencia indicada)"}}
  var d=Math.round((new Date(l.v+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5);
  if(d<0)return {c:"bad",t:"Lista vencida hace "+(-d)+" días"};if(d<=30)return {c:"warn",t:"Lista vence en "+d+" días"};return {c:"ok",t:"Vigente hasta "+fdate(l.v)}}
function waNum(s){var d=String(s.wa||"").replace(/\D/g,"");if(!d)return "";if(d.length===10)d="52"+d;return d}
function costear(o,qty){
  var s=sup(o.sup),pk=Math.ceil(qty/o.units),base=o.precio*pk,iva=o.ivaIncl?0:base*o.iva,sub=base+iva,env=envioDe(s,sub),tot=sub+env,pz=pk*o.units;
  return {pk:pk,pz:pz,base:base,iva:iva,sub:sub,env:env,tot:tot,pu:tot/pz,puSin:sub/pz};
}
function calcGrupo(sid,items){
  var s=sup(sid),lines=items.map(function(it){var o=offer(sid,it.art),a=art(it.art),pk=Math.ceil(it.u/o.units),base=o.precio*pk,iva=o.ivaIncl?0:base*o.iva;
    return {art:it.art,u:it.u,clave:o.clave,desc:o.desc,nombre:a.nombre,units:o.units,pres:o.pres,pk:pk,precio:o.precio,ivaIncl:o.ivaIncl,ivaRate:o.iva,base:base,iva:iva,unidad:a.u}});
  var sub=lines.reduce(function(t,l){return t+l.base},0),iva=lines.reduce(function(t,l){return t+l.iva},0),env=envioDe(s,sub+iva);
  return {lines:lines,sub:sub,iva:iva,env:env,tot:sub+iva+env};

function matchArts(){
  var q=norm(S.q.trim());
  return D.art.filter(function(a){
    if(S.cat!=="all"&&a.cat!==S.cat)return false;
    var offs=offersFor(a.id);if(!offs.length)return false;
    if(!q)return true;
    var hay=norm(a.nombre+" "+(a.sub||"")+" "+(a.act||"")+" "+offs.map(function(o){return o.desc+" "+o.clave+" "+o.marca+" "+sup(o.sup).nombre}).join(" "));
    return q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0});
  }).sort(function(p,q){return new Set(offersFor(q.id).map(function(o){return o.sup})).size-new Set(offersFor(p.id).map(function(o){return o.sup})).size||p.nombre.localeCompare(q.nombre)});
}
function bestPu(aid){var b=null;offersFor(aid).forEach(function(o){var c=costear(o,1);var pu=c.sub/c.pz;if(b===null||pu<b)b=pu});return b}

  var more=arts.length>15?'<div class="muted" style="font-size:12px;text-align:center">'+arts.length+' artículos; escribe más para afinar.</div>':'';
  return arts.slice(0,15).map(function(a){var n=new Set(offersFor(a.id).map(function(o){return o.sup})).size,b=bestPu(a.id);
    return '<button class="art-item" data-act="sel" data-id="'+esc(a.id)+'" aria-current="'+(a.id===S.sel)+'"><span><span class="n">'+esc(a.nombre)+'</span><br><span class="s">'+esc(a.sub||CATN[a.cat])+' · '+n+' proveedor'+(n===1?'':'es')+'</span></span><span class="p num">'+(b?'desde '+$m(b)+'<br><span class="s">por '+esc(a.u)+'</span>':'')+'</span></button>'}).join("")+more;
}

function spark(o){

  var ps=h.map(function(x){return x.p}),mn=Math.min.apply(0,ps),mx=Math.max.apply(0,ps),rg=mx-mn||1,W=84,H=26,p=3;
  var pts=h.map(function(x,i){return [p+i*(W-2*p)/(h.length-1),H-p-(x.p-mn)/rg*(H-2*p)]});
  var last=ps[ps.length-1],prev=ps[ps.length-2],ch=(last-prev)/prev*100,cls=ch>0.05?"diff-up":ch<-0.05?"diff-down":"muted";

  var rows=[];arts.forEach(function(x){offersFor(x.id).forEach(function(o){rows.push({o:o,a:x,c:costear(o,S.qty),s:sup(o.sup)})})});

      if(fast!==rows[0])add(fast,'<span class="tag fast">Entrega más rápida</span>');

   (a.act?'<label class="switch" style="grid-column:1/-1" for="equiv"><input id="equiv" type="checkbox"'+(S.equiv?" checked":"")+'> Incluir equivalentes con el mismo principio activo</label>':'')+'</div>';
  if(!rows.length)return h+'<div class="empty">Ningún proveedor tiene este artículo en sus listas.</div>';
  h+='<div class="offers">'+rows.map(function(r,i){
    var o=r.o,c=r.c,s=r.s,v=vigL(lista(o.lista)),eq=r.a.id!==a.id;
    return '<article class="offer'+(i===0&&rows.length>1?" first":"")+'">'+

     '<div class="big">'+$m(S.sort==="real"?c.pu:c.puSin)+'<small>por '+esc(a.u)+(S.sort==="real"?' · costo real':' · sin envío')+'</small></div></div>'+

  '<div class="tablewrap"><table><thead><tr><th>Clave</th><th>Artículo</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Importe</th></tr></thead><tbody>'+
  o.lines.map(function(l){return '<tr><td class="num">'+esc(l.clave||"—")+'</td><td>'+esc(l.desc)+'<br><span style="color:var(--ink2)">'+esc(l.pres)+(l.ivaRate?(l.ivaIncl?' · IVA incluido':' · + IVA 16%'):' · IVA 0%')+'</span></td><td class="r num">'+l.pk+'</td><td class="r num">'+$m(l.precio)+'</td><td class="r num">'+$m(l.precio*l.pk)+'</td></tr>'}).join("")+'</tbody></table></div>'+
  '<div class="pf"><div class="qr"><div class="q" id="qr-'+o.id+'"></div>Escanee para confirmar recepción y fecha de entrega</div><div class="tot num"><span>Subtotal</span><span>'+$m(o.sub)+'</span><span>IVA</span><span>'+$m(o.iva)+'</span>'+(o.env>0.005?'<span>Envío</span><span>'+$m(o.env)+'</span>':'')+'<span class="t">Total</span><span class="t">'+$m(o.tot)+'</span></div></div>'+
  '<div class="sign">Favor de facturar con XML y PDF citando el folio '+esc(o.folio)+'. Los datos fiscales aparecen en la página del QR.</div></div>';
}

/* ---------- import ---------- */
var impState=null;
function openImport(sid){
  var s=sup(sid),ls=D.listas.filter(function(l){return l.sup===sid});impState={sid:sid,rows:null,fname:""};
  openSheet('<div class="sheet-head"><div><div class="eyebrow">Actualizar lista de precios</div><h2 style="margin:0">'+esc(s.nombre)+'</h2></div><button class="x" data-act="close" aria-label="Cerrar">×</button></div>'+
   '<div class="stack"><label for="implista" class="eyebrow">Lista que se actualiza</label><select id="implista">'+ls.map(function(l){return '<option value="'+esc(l.id)+'">'+esc(l.nombre)+'</option>'}).join("")+'<option value="">Lista nueva</option></select>'+
   '<div class="infobox">La lectura automática de PDF y fotos se activa en la siguiente fase. Por ahora copia las columnas desde Excel (clave, descripción, precio) y pégalas aquí; la app compara contra la lista vigente y tú apruebas los cambios.</div>'+
   '<label class="eyebrow" for="imptxt">Clave, descripción, precio</label><textarea id="imptxt" placeholder="CLAVE,Descripción del artículo,420.00"></textarea>'+
   '<button class="btn" data-act="impcheck">Revisar cambios</button><div id="impres"></div></div>');
}
function impCheck(){
  var s=sup(impState.sid),txt=document.getElementById("imptxt").value.trim().split(/\n+/),rows=[];
  txt.forEach(function(l){if(!l.trim()||/^clave/i.test(l))return;var p=l.split(/\t|,/);if(p.length<3)return;var price=parseFloat(p[p.length-1].replace(/[$\s]/g,""));if(isNaN(price))return;
    var clave=p[0].trim(),desc=p.slice(1,p.length-1).join(",").trim(),o=D.off.find(function(x){return x.sup===s.id&&x.clave&&x.clave===clave});
    rows.push({clave:clave,desc:desc,price:price,o:o})});
  if(!rows.length){document.getElementById("impres").innerHTML='<div class="warnbox">No se encontraron renglones con clave, descripción y precio.</div>';return}
  rows.forEach(function(r){r.ch=r.o?(r.price-r.o.precio)/r.o.precio*100:null;r.same=r.o&&Math.abs(r.price-r.o.precio)<.005;r.big=r.o&&Math.abs(r.ch)>15;r.auto=r.o&&!r.same&&!r.big});
  impState.rows=rows;
  var up=0,dn=0,eq=0,nw=0;rows.forEach(function(r){if(!r.o)nw++;else if(r.same)eq++;else if(r.ch>0)up++;else dn++});
  var h='<div class="row" style="margin-block:4px 10px"><span class="pill bad">'+up+' alza'+(up===1?'':'s')+'</span><span class="pill ok">'+dn+' baja'+(dn===1?'':'s')+'</span><span class="pill acc">'+eq+' sin cambio</span><span class="pill warn">'+nw+' nuevo'+(nw===1?'':'s')+'</span></div>'+
   '<div class="tablewrap"><table><thead><tr><th>Aplicar</th><th>Artículo</th><th class="r">Antes</th><th class="r">Ahora</th><th class="r">Cambio</th></tr></thead><tbody>'+
   rows.map(function(r,i){
     if(!r.o)return '<tr><td>—</td><td><span class="num">'+esc(r.clave)+'</span> · '+esc(r.desc)+'<br><label class="muted" for="lk'+i+'" style="font-size:12px">Vincular al catálogo</label><select id="lk'+i+'"><option value="">No importar</option><option value="__new">Crear artículo nuevo</option>'+D.art.slice().sort(function(p,q){return p.nombre.localeCompare(q.nombre)}).map(function(a){return '<option value="'+esc(a.id)+'">'+esc(a.nombre)+'</option>'}).join("")+'</select></td><td class="r">—</td><td class="r num">'+$m(r.price)+'</td><td class="r warn">Nuevo</td></tr>';
     var cls=r.ch>0.05?"diff-up":r.ch<-0.05?"diff-down":"muted";
     return '<tr><td>'+(r.same?'—':'<input type="checkbox" id="ap'+i+'"'+(r.auto?' checked':'')+' aria-label="Aplicar">')+'</td><td><span class="num">'+esc(r.clave)+'</span> · '+esc(art(r.o.art).nombre)+(r.big?' <span class="pill bad">Cambio mayor a 15%</span>':'')+'</td><td class="r num">'+$m(r.o.precio)+'</td><td class="r num">'+$m(r.price)+'</td><td class="r num '+cls+'">'+(r.ch>0?"+":"")+r.ch.toFixed(1)+'%</td></tr>'}).join("")+'</tbody></table></div>'+
   '<button class="btn pri block" style="margin-top:12px" data-act="impapply">Aplicar seleccionados con mi PIN</button>';
  document.getElementById("impres").innerHTML=h;
}
function impApply(){
  var s=sup(impState.sid),lid=document.getElementById("implista").value,cambios=[],nuevos=[];
  impState.rows.forEach(function(r,i){
    if(r.o){var cb=document.getElementById("ap"+i);if(cb&&cb.checked)cambios.push({oferta_id:r.o.id,precio:r.price});return}
    var sel=document.getElementById("lk"+i);if(!sel||!sel.value)return;
    var any=D.off.find(function(o){return o.sup===s.id}),cat=sel.value==="__new"?(any?art(any.art).cat:"qx"):art(sel.value).cat;
    nuevos.push({articulo_id:sel.value==="__new"?"":sel.value,cat:cat,clave:r.clave,descripcion:r.desc,precio:r.price});
  });
  if(!cambios.length&&!nuevos.length){toast("No hay cambios seleccionados");return}
  askPin("Actualizar lista de "+s.nombre,cambios.length+" cambio(s) y "+nuevos.length+" artículo(s) nuevo(s). Vigencia 90 días.",function(pin,done){
    rpc("prv_aplicar_lista",{p_usuario:SES.id,p_pin:pin,p_datos:{proveedor_id:s.id,lista_id:lid,cambios:cambios,nuevos:nuevos}}).then(function(r){
      if(!r.ok)return done(errTxt(r));
      done();sheet.hidden=true;toast("Lista actualizada · "+r.cambios+" cambio"+(r.cambios===1?"":"s"));loadCatalog().then(render);
    }).catch(function(e){done("Sin conexión: "+e.message)});
  });
}

/* ---------- PIN ---------- */
var pinEl=document.getElementById("pin"),pinCb=null;
function askPin(title,detail,cb,label){
  pinCb=cb;pinEl.innerHTML='<div class="card" role="dialog" aria-modal="true"><h3>'+esc(title)+'</h3><div class="muted" style="font-size:13px">'+detail+'</div><label class="eyebrow" for="pinin">'+(label||'PIN de '+esc(SES.nombre))+'</label><input id="pinin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><div id="pinerr" class="bad" style="font-size:13px" hidden></div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="pincancel">Cancelar</button><button class="btn pri" data-act="pinok">Firmar</button></div></div>';
  pinEl.hidden=false;setTimeout(function(){var i=document.getElementById("pinin");if(i)i.focus()},50);
}
function pinDone(err){var b=document.querySelector('[data-act="pinok"]');if(b){b.disabled=false;b.textContent="Firmar"}
  if(err){var e=document.getElementById("pinerr");if(e){e.textContent=err;e.hidden=false}var i=document.getElementById("pinin");if(i){i.value="";i.focus()}return}
  pinEl.hidden=true;pinCb=null}

/* ---------- toast ---------- */
var tEl=document.getElementById("toast"),tT;
function toast(m){tEl.textContent=m;tEl.hidden=false;clearTimeout(tT);tT=setTimeout(function(){tEl.hidden=true},3000)}

/* ---------- acciones de pedido ---------- */
function generar(){
  var g=cartGroups(),sede=document.getElementById("sede").value,area=document.getElementById("area").value,urg=document.getElementById("urg").checked,motivo=document.getElementById("motivo").value.trim();
  var groups=Object.keys(g).map(function(sid){var c=calcGrupo(sid,g[sid].map(function(it){return {art:it.art,u:it.u}}));
    var comp=c.lines.map(function(l){var alt=offersFor(l.art).map(function(o){var cc=costear(o,1);return {proveedor:sup(o.sup).nombre,precio_unitario:Math.round(cc.sub/cc.pz*100)/100}}).sort(function(a,b){return a.precio_unitario-b.precio_unitario}).slice(0,4);return {articulo:l.nombre,opciones:alt}});
    return {sid:sid,datos:{proveedor_id:sid,area:area,sede:sede,urgente:urg,monto:Math.round(c.tot*100)/100,notas:motivo,
      descripcion:"Comparador · "+sup(sid).nombre+": "+c.lines.map(function(l){return l.nombre+" × "+l.pk}).join(", ")+(motivo?" — "+motivo:""),
      partidas:c.lines.map(function(l){return {clave:l.clave,descripcion:l.desc,cantidad:l.pk,unidad:l.pres,piezas:l.units,precio:l.precio,iva:l.ivaRate,iva_incluido:l.ivaIncl,articulo_id:l.art}}),comparacion:comp}}});
  askPin("Generar "+groups.length+" orden"+(groups.length===1?"":"es"),"Se registran en COE Finanzas como pedidos por autorizar.",function(pin,done){
    var made=[],seq=Promise.resolve();
    groups.forEach(function(gr){seq=seq.then(function(){return rpc("prv_pedido_crear",{p_usuario:SES.id,p_pin:pin,p_datos:gr.datos}).then(function(r){if(!r.ok)throw new Error(errTxt(r));made.push(r.folio);CART=CART.filter(function(it){return it.sup!==gr.sid});lsSet(KEY_C,CART)})})});
    seq.then(function(){done();toast(made.length+" orden"+(made.length===1?"":"es")+" en Finanzas: "+made.join(", "));S.tab="ordenes";S.ofilter="pend";return loadOrders()}).then(render).catch(function(e){done(e.message);if(made.length){toast("Se generaron: "+made.join(", "));loadOrders().then(render)}});
  });
}
function autorizar(o){
  askPin("Autorizar "+o.folio,esc(sup(o.sup).nombre)+" · Total <b class=\"num\">"+$m(o.tot)+"</b>",function(pin,done){
    var go=function(pinDir){return rpc("fin_pedido_autorizar",{p_usuario:SES.id,p_pin:pin,p_pin_director:pinDir||null,p_pedido:o.id,p_decision:"autorizar",p_nota:null})};
    go(null).then(function(r){
      if(r.ok){done();toast("Orden autorizada");return reloadOpen(o.id)}
      if(r.error==="director_requerido"){done();askPin("Doble firma","Más de $3,000: firma también el Director General.",function(pd,done2){go(pd).then(function(r2){if(!r2.ok)return done2(errTxt(r2));done2();toast("Orden autorizada con doble firma");reloadOpen(o.id)})},"PIN del Director General");return}
      done(errTxt(r));
    }).catch(function(e){done("Sin conexión: "+e.message)});
  });
}
function rechazar(o){
  openSheet('<div class="sheet-head"><div><div class="eyebrow">Rechazar orden</div><h2 class="num" style="margin:0">'+esc(o.folio)+'</h2></div><button class="x" data-act="close" aria-label="Cerrar">×</button></div><div class="stack"><label class="eyebrow" for="rmot">Motivo</label><textarea id="rmot" style="font-family:var(--f-ui);min-height:90px"></textarea><button class="btn pri block" data-act="rechok" data-id="'+o.id+'">Rechazar con mi PIN</button></div>');
}
function enviar(o){
  askPin("Marcar como enviada",o.folio+" · se abrirá WhatsApp con la orden",function(pin,done){
    rpc("fin_pedido_estado",{p_usuario:SES.id,p_pin:pin,p_pedido:o.id,p_estado:"enviado",p_datos:{}}).then(function(r){
      if(!r.ok)return done(errTxt(r));
      done();var acts=document.getElementById("oacts");
      if(acts)acts.innerHTML='<a class="btn wa" id="walink" href="https://wa.me/'+waNum(sup(o.sup))+'?text='+encodeURIComponent(waText(o))+'" target="_blank" rel="noopener">Abrir WhatsApp</a><span class="ok" style="font-size:13px">Enviada. Toca para abrir WhatsApp.</span>';
      var w=document.getElementById("walink");if(w)w.focus();
      loadOrders().then(function(){if(!sheet.hidden&&curOrder===o.id){}});
    }).catch(function(e){done("Sin conexión: "+e.message)});
  });
}
function recibir(o){
  askPin("Registrar recibido",o.folio+" · después se capturan lotes y caducidades en el almacén de COE Finanzas",function(pin,done){
    rpc("fin_pedido_estado",{p_usuario:SES.id,p_pin:pin,p_pedido:o.id,p_estado:"recibido",p_datos:{}}).then(function(r){if(!r.ok)return done(errTxt(r));done();toast("Recepción registrada");reloadOpen(o.id)}).catch(function(e){done("Sin conexión: "+e.message)});
  });
}
function reloadOpen(id){return loadOrders().then(function(){render();if(!sheet.hidden)openOrder(id)})}
function fallbackCopy(txt){var ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);toast(ok?"Mensaje copiado":"No se pudo copiar")}

/* ---------- login ---------- */
function vLogin(msg){
  document.getElementById("app").hidden=true;var L=document.getElementById("login");L.hidden=false;
  L.innerHTML='<div class="login-card"><div class="brand">'+LOGO+'<div><b>COE Proveedores</b><small>Entra con tu usuario de COE Finanzas</small></div></div>'+
   '<label class="eyebrow" for="lu">Usuario</label><input id="lu" type="text" autocomplete="username" autocapitalize="none" value="'+esc(lsGet("coe-prov-ultimo")||"")+'">'+
   '<label class="eyebrow" for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password">'+
   '<div id="lerr" class="bad" style="font-size:13px"'+(msg?'':' hidden')+'>'+esc(msg||"")+'</div><button class="btn pri block" data-act="login">Entrar</button>'+
   '<p class="muted" style="font-size:12px;margin:0">Los permisos y el PIN son los mismos de COE Finanzas.</p></div>';
  setTimeout(function(){var u=document.getElementById(lsGet("coe-prov-ultimo")?"lp":"lu");if(u)u.focus()},50);
}
function doLogin(){
  var u=document.getElementById("lu").value.trim(),p=document.getElementById("lp").value,b=document.querySelector('[data-act="login"]');
  if(!u||!p){document.getElementById("lerr").textContent="Escribe usuario y contraseña.";document.getElementById("lerr").hidden=false;return}
  b.disabled=true;b.textContent="Entrando…";
  rpc("fin_login",{p_usuario:u,p_password:p}).then(function(r){
    if(!r.ok){b.disabled=false;b.textContent="Entrar";var e=document.getElementById("lerr");e.textContent=errTxt(r);e.hidden=false;return}
    if(r.debe_cambiar){b.disabled=false;b.textContent="Entrar";var e2=document.getElementById("lerr");e2.textContent="Primero cambia tu contraseña provisional en COE Finanzas.";e2.hidden=false;return}
    SES={id:r.id,nombre:r.nombre,rol:r.rol,usuario:r.usuario,sede:r.sede};lsSet(KEY_S,SES);lsSet("coe-prov-ultimo",r.usuario);start();
  }).catch(function(e){b.disabled=false;b.textContent="Entrar";var x=document.getElementById("lerr");x.textContent="Sin conexión: "+e.message;x.hidden=false});
}
function start(){
  document.getElementById("login").hidden=true;document.getElementById("app").hidden=false;
  document.getElementById("who").textContent=SES.nombre;
  view.innerHTML='<div class="empty">Cargando catálogo…</div>';
  loadCatalog().then(function(){if(!art(S.sel)&&D.art[0])S.sel=D.art[0].id;render();return loadOrders()}).then(render).catch(function(e){view.innerHTML='<div class="warnbox">No se pudo cargar el catálogo: '+esc(e.message)+'. Revisa tu conexión y recarga.</div>'});
}

/* ---------- eventos ---------- */
function cartFind(k){var p=k.split("|");return CART.find(function(it){return it.sup===p[0]&&it.art===p[1]})}
function mergeCart(){var m={};CART.forEach(function(it){var k=it.sup+"|"+it.art;if(m[k])m[k].u+=it.u;else m[k]=it});CART=Object.keys(m).map(function(k){return m[k]})}
function saveCart(){lsSet(KEY_C,CART)}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  var a=t.dataset.act,id=t.dataset.id,o=id&&D.orders.find(function(x){return x.id===id});
  if(a==="login")doLogin();
  else if(a==="logout"){SES=null;try{localStorage.removeItem(KEY_S)}catch(e2){}vLogin()}
  else if(a==="sel"){S.sel=id;render();var c=document.getElementById("cmp");if(c)c.scrollIntoView({behavior:"smooth",block:"start"})}
  else if(a==="cat"){S.cat=id;render()}
  else if(a==="qty"){S.qty=Math.max(1,S.qty+(+t.dataset.d));render()}
  else if(a==="add"){var ex=CART.find(function(it){return it.sup===t.dataset.s&&it.art===t.dataset.a});if(ex)ex.u+=S.qty;else CART.push({sup:t.dataset.s,art:t.dataset.a,u:S.qty});saveCart();render();toast(art(t.dataset.a).nombre+" agregado · "+sup(t.dataset.s).nombre)}
  else if(a==="cu"){var it=cartFind(t.dataset.k);it.u=Math.max(1,it.u+(+t.dataset.d));saveCart();render()}
  else if(a==="crm"){var it2=cartFind(t.dataset.k);CART.splice(CART.indexOf(it2),1);saveCart();render()}
  else if(a==="optimize"){CART.forEach(function(it){var best=null,bp=0;offersFor(it.art).forEach(function(of){var c=costear(of,it.u),pu=c.sub/c.pz;if(!best||pu<bp){best=of;bp=pu}});if(best)it.sup=best.sup});mergeCart();saveCart();render();toast("Cada artículo quedó con el proveedor más barato")}
  else if(a==="gen")generar();
  else if(a==="of"){S.ofilter=id;render()}
  else if(a==="reload"){loadOrders().then(render);toast("Órdenes actualizadas")}
  else if(a==="open")openOrder(id);
  else if(a==="close")closeSheet();
  else if(a==="supedit")openSup(id);
  else if(a==="supsave")saveSup(id);
  else if(a==="auth")autorizar(o);
  else if(a==="rech")rechazar(o);
  else if(a==="rechok"){var mot=document.getElementById("rmot").value.trim();if(!mot){toast("Escribe el motivo");return}
    askPin("Rechazar "+o.folio,"Motivo: "+esc(mot),function(pin,done){rpc("fin_pedido_autorizar",{p_usuario:SES.id,p_pin:pin,p_pin_director:null,p_pedido:o.id,p_decision:"rechazar",p_nota:mot}).then(function(r){if(!r.ok)return done(errTxt(r));done();toast("Orden rechazada");reloadOpen(o.id)}).catch(function(e2){done("Sin conexión: "+e2.message)})})}
  else if(a==="send")enviar(o);
  else if(a==="rec")recibir(o);
  else if(a==="copy"){var txt=waText(o);try{navigator.clipboard.writeText(txt).then(function(){toast("Mensaje copiado")},function(){fallbackCopy(txt)})}catch(e3){fallbackCopy(txt)}}
  else if(a==="imp")openImport(id);
  else if(a==="impcheck")impCheck();
  else if(a==="impapply")impApply();
  else if(a==="theme")openTheme();
  else if(a==="th"){TH.t=id;applyTheme();lsSet(TKEY,TH);openTheme()}
  else if(a==="acc"){TH.acc=id;applyTheme();lsSet(TKEY,TH);openTheme()}
  else if(a==="threset"){TH={t:"negro",acc:"#4cc3d3"};applyTheme();lsSet(TKEY,TH);openTheme()}
  else if(a==="pincancel"){pinEl.hidden=true;pinCb=null}
  else if(a==="pinok"){var v=(document.getElementById("pinin").value||"").trim();if(!v){pinDone("Escribe tu PIN.");return}t.disabled=true;t.textContent="Firmando…";if(pinCb)pinCb(v,pinDone)}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;var l=document.getElementById("alist");if(l)l.innerHTML=vLista()}});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="qty"){S.qty=Math.max(1,parseInt(t.value,10)||1);render()}
  else if(t.id==="sort"){S.sort=t.value;render()}
  else if(t.id==="equiv"){S.equiv=t.checked;render()}
  else if(t.id==="accpick"){TH.acc=t.value;applyTheme();lsSet(TKEY,TH)}
  else if(t.dataset.act==="cuin"){var it=cartFind(t.dataset.k);it.u=Math.max(1,parseInt(t.value,10)||1);saveCart();render()}
  else if(t.dataset.act==="csup"){var it2=cartFind(t.dataset.k);it2.sup=t.value;mergeCart();saveCart();render()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="pinin"){e.preventDefault();var b=document.querySelector('[data-act="pinok"]');if(b&&!b.disabled)b.click()}
  if(e.key==="Enter"&&(e.target.id==="lp"||e.target.id==="lu")){e.preventDefault();doLogin()}
  if(e.key==="Escape"){if(!pinEl.hidden){pinEl.hidden=true;pinCb=null}else if(!sheet.hidden)closeSheet()}
});
sheet.addEventListener("click",function(e){if(e.target===sheet)closeSheet()});

loadTheme();applyTheme();
CART=lsGet(KEY_C)||[];SES=lsGet(KEY_S);
if(SES&&SES.id)start();else vLogin();
})();

</script>
</body></html>
